site_name: VEX Wiki
site_description: 雷鸣 (Luke) 的个人 Wiki 知识库 · 搞软件，耍 AI，啥新鲜整啥
site_author: vex-rune
site_url: https://wiki.vexrune.top
site_dir: ./site
docs_dir: ./docs
copyright: Copyright © 2026 VEX · <a href="https://vexrune.top/" target="_blank" rel="noopener">vexrune.top</a>

theme:
  name: material
  language: zh
  custom_dir: overrides
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  features:
    # 导航
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.prune
    - toc.follow
    # 搜索
    - search.suggest
    - search.highlight
    - search.share
    # 内容
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - content.tooltips
    - content.footnote.tooltips
    - content.icons
    - content.links
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到暗黑模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到明亮模式

strict: false

markdown_extensions:
  # 基础扩展
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - meta

  # PyMdown 扩展
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
      lang:
        - en
        - zh
  - mkdocs-nav-weight:
      section_renamed: true
      index_weight: -10
      warning: true
      reverse: false
      headless_included: false
      default_page_weight: 0

extra_css:
  - stylesheets/extra.css

extra_javascript: []

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vex-rune
      name: GitHub
    - icon: fontawesome/brands/git-alt
      link: https://gitee.com/vex-rune
      name: Gitee
    - icon: fontawesome/brands/bilibili
      link: https://space.bilibili.com/32121230
      name: Bilibili
    - icon: fontawesome/solid/globe
      link: https://vexrune.top/
      name: 主页
  generator: false