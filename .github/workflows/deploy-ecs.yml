name: 🚀 部署到阿里云ECS服务器 (rsync 增量)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 同一时间只允许一个部署任务进行, 避免并发覆盖
    concurrency:
      group: deploy-ecs
      cancel-in-progress: false

    steps:
      - name: 📦 拉取代码
        uses: actions/checkout@v4

      - name: ✅ 代码拉取验证
        run: |
          echo "============================================="
          echo "📦 代码拉取验证"
          echo "============================================="
          echo "✅ 当前分支: $(git rev-parse --abbrev-ref HEAD)"
          echo "✅ 最新提交: $(git log -1 --pretty=format:'%s')"
          echo "✅ 提交时间: $(git log -1 --pretty=format:'%ci')"
          echo "✅ 提交者: $(git log -1 --pretty=format:'%an')"
          echo "✅ 仓库大小: $(du -sh .git | cut -f1)"
          echo "============================================="

      - name: 🐍 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ✅ Python环境验证
        run: |
          echo "============================================="
          echo "🐍 Python环境验证"
          echo "============================================="
          echo "✅ Python 版本: $(python --version)"
          echo "✅ Pip 版本: $(pip --version)"
          echo "✅ 已安装包数量: $(pip list | wc -l)"
          echo "============================================="

      - name: 📥 安装MkDocs依赖
        run: |
          echo "============================================="
          echo "📥 安装MkDocs依赖"
          echo "============================================="
          echo "📦 开始安装时间: $(date '+%H:%M:%S')"
          pip install --no-cache-dir -r requirements.txt
          echo "📦 安装完成时间: $(date '+%H:%M:%S')"
          echo "============================================="

      - name: ✅ 依赖安装验证
        run: |
          echo "============================================="
          echo "✅ 依赖安装验证"
          echo "============================================="
          echo "✅ MkDocs 版本: $(mkdocs --version)"
          echo "✅ 已安装包列表:"
          pip list | grep -E "mkdocs|pymdown|fontawesome"
          echo "============================================="

      - name: 🏗️ 构建静态网站 (增量)
        # 不加 --clean: mkdocs 复用未变更的产物, 加快构建
        # 不加 --verbose: 减少日志噪音
        run: mkdocs build

      - name: ✅ 构建产物验证
        run: |
          echo "============================================="
          echo "✅ 构建产物验证"
          echo "============================================="
          if [ ! -d "site" ]; then
            echo "❌ 构建失败: site 目录不存在"
            exit 1
          fi
          if [ ! -f "site/index.html" ]; then
            echo "❌ 构建失败: index.html 不存在"
            exit 1
          fi
          echo "✅ 构建成功"
          echo "✅ site 目录大小: $(du -sh site | cut -f1)"
          echo "✅ 文件总数: $(find site -type f | wc -l)"
          echo "✅ 目录总数: $(find site -type d | wc -l)"
          echo ""
          echo "📊 文件类型统计:"
          find site -type f -name "*.html" | wc -l | xargs echo "  HTML文件: "
          find site -type f -name "*.css" | wc -l | xargs echo "  CSS文件:  "
          find site -type f -name "*.js" | wc -l | xargs echo "  JS文件:   "
          echo "============================================="

      - name: 🔑 配置SSH连接密钥
        run: |
          echo "============================================="
          echo "🔑 配置SSH连接密钥"
          echo "============================================="
          mkdir -p ~/.ssh/
          echo "${{ secrets.ALIYUN_ECS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 8.160.183.109 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "✅ SSH密钥配置完成"
          echo "============================================="

      - name: 🛡️ 服务器连通性与目录就绪检查
        run: |
          echo "============================================="
          echo "🛡️ 服务器连通性检查"
          echo "============================================="
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@8.160.183.109 \
            "mkdir -p /app/vex-wiki && [ -w /app/vex-wiki ] && echo '✅ 部署目录就绪: /app/vex-wiki'"
          echo "============================================="

      - name: 🚀 增量同步到服务器 (rsync)
        # rsync 参数:
        #   -a   归档模式 (递归 + 保留权限/时间/链接)
        #   -v   verbose, 显示每个文件的操作
        #   -z   传输时压缩, 节省带宽
        #   --delete         删除远端有但本地没有的文件 (真正的"同步")
        #   --itemize-changes  输出格式化的变更标记 (>f+ / .t 等)
        #   --stats          最后输出汇总统计
        #   -e ssh           使用 SSH 传输 (携带密钥)
        run: |
          echo "============================================="
          echo "🚀 增量同步到服务器 (rsync)"
          echo "============================================="
          rsync -avz --delete --itemize-changes --stats \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            site/ root@8.160.183.109:/app/vex-wiki/
          echo "============================================="

      - name: ✅ 同步验证
        run: |
          echo "============================================="
          echo "✅ 同步验证"
          echo "============================================="
          REMOTE_FILE_COUNT=$(ssh root@8.160.183.109 "find /app/vex-wiki -type f | wc -l")
          LOCAL_FILE_COUNT=$(find site -type f | wc -l)
          echo "📦 本地文件数: $LOCAL_FILE_COUNT"
          echo "📦 远程文件数: $REMOTE_FILE_COUNT"
          echo "📦 远程目录大小: $(ssh root@8.160.183.109 "du -sh /app/vex-wiki | cut -f1")"
          if [ "$REMOTE_FILE_COUNT" -eq "$LOCAL_FILE_COUNT" ]; then
            echo "✅ 文件数一致, 同步完成"
            echo ""
            echo "📊 远程文件类型统计:"
            ssh root@8.160.183.109 "find /app/vex-wiki -type f -name '*.html' | wc -l" | xargs echo "  HTML文件: "
            ssh root@8.160.183.109 "find /app/vex-wiki -type f -name '*.css' | wc -l" | xargs echo "  CSS文件:  "
            ssh root@8.160.183.109 "find /app/vex-wiki -type f -name '*.js' | wc -l" | xargs echo "  JS文件:   "
          else
            echo "❌ 文件数不一致 (本地 $LOCAL_FILE_COUNT / 远程 $REMOTE_FILE_COUNT), 请检查"
            exit 1
          fi
          echo "============================================="

      - name: 🎉 部署完成
        run: |
          echo "============================================="
          echo "🎉 部署完成"
          echo "============================================="
          echo "✅  部署成功!"
          echo ""
          echo "🌐  访问地址: http://8.160.183.109"
          echo "🌐  域名访问: http://wiki.vexruna.top"
          echo ""
          echo "📦  部署信息:"
          echo "    本地文件数: $(find site -type f | wc -l)"
          echo "    远程文件数: $(ssh root@8.160.183.109 "find /app/vex-wiki -type f | wc -l")"
          echo "    本地大小:   $(du -sh site | cut -f1)"
          echo "    远程大小:   $(ssh root@8.160.183.109 "du -sh /app/vex-wiki | cut -f1")"
          echo "    部署时间:   $(date '+%Y-%m-%d %H:%M:%S')"
          echo "    Git提交:    $(git log -1 --pretty=format:'%s')"
          echo "============================================="
