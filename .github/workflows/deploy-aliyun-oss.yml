name: 🚀 Deploy to Aliyun OSS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 拉取代码
        uses: actions/checkout@v4

      - name: 🐍 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 📥 安装 MkDocs + Material
        run: pip install -r requirements.txt

      - name: 🏗️ 构建静态网站
        # 注: mkdocs.yml 中已设置 strict: false
        # 旧命令 mkdocs build --strict 会被 docs/ 中 184 条
        # 历史遗留的 #anchor 找不到 警告中断
        # 改用普通构建，警告作为 INFO 输出
        run: mkdocs build

      # 官方一键安装 ossutil
      - name: 📁 安装 ossutil
        run: |
          sudo -v ; curl https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          ossutil --version

      - name: 🔑 配置 OSS 凭证
        run: |
          ossutil config -e oss-cn-shenzhen.aliyuncs.com \
            -i ${{ secrets.ALIYUN_ACCESS_KEY_ID }} \
            -k ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }} \
            -L CH

      - name: 🗑️ 清空 OSS 旧文件
        run: ossutil rm -r oss://vexrune-wike/ --include "*" -f

      - name: ☁️ 上传 HTML
        run: |
          ossutil cp site/ oss://vexrune-wike/ -r -f --acl public-read \
            --meta "Content-Type:text/html; charset=utf-8" --include "*.html"

      - name: ☁️ 上传 CSS
        run: |
          ossutil cp site/ oss://vexrune-wike/ -r -f --acl public-read \
            --meta "Content-Type:text/css" --include "*.css"

      - name: ☁️ 上传 JS
        run: |
          ossutil cp site/ oss://vexrune-wike/ -r -f --acl public-read \
            --meta "Content-Type:application/javascript" --include "*.js"

      - name: ☁️ 上传其他资源
        run: |
          ossutil cp site/ oss://vexrune-wike/ -r -f --acl public-read \
            --exclude "*.html" --exclude "*.css" --exclude "*.js"

      - name: 🎉 部署成功
        run: echo "✅ 网站正常访问：https://wiki.vexrune.top"