<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="VEX">
  <defs>
    <linearGradient id="vex-bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="vex-shine" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角方形品牌底 -->
  <rect width="200" height="200" rx="44" fill="url(#vex-bg)"/>
  <!-- 左上柔光, 让图标在浅色背景更立体 -->
  <rect width="200" height="200" rx="44" fill="url(#vex-shine)"/>

  <!-- V 字主体: 两笔粗斜线在底部汇聚 -->
  <path d="M46.875 65.625 L100 143.75 L153.125 65.625"
        stroke="white" stroke-width="21.25"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- 顶端信号节点: 接入设备/传感器 -->
  <circle cx="100" cy="40.625" r="10" fill="white"/>

  <!-- 节点与 V 之间的连接线, 表达 "设备→平台" 上行链路 -->
  <path d="M100 52.5 L100 72.5" stroke="white" stroke-width="8.75" stroke-linecap="round"/>
</svg>